[package]
name = "asplayer-transcribe"
version = "0.1.0"
edition = "2021"

[lib]
name = "asplayer_transcribe"
path = "src/lib.rs"

[dependencies]
whisper-rs = "0.13"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
