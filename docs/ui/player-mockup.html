<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASPlayer · Apple 极简风原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0a0b; color: #f5f5f7;
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .app { display: flex; height: 100vh; }
  .stage { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: #000; }
  .stage-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; background: #101012; border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .stage-title { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: #f5f5f7; }
  .toolbar { display: flex; gap: 4px; }
  .iconbtn {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: #8a8a8f; border-radius: 8px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .iconbtn:hover { background: rgba(255,255,255,.06); color: #f5f5f7; }
  .iconbtn svg { width: 16px; height: 16px; }
  .canvas { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
  .empty { text-align: center; }
  .empty-badge {
    width: 96px; height: 96px; margin: 0 auto 26px; border-radius: 22px;
    background: linear-gradient(160deg, #1a1a1d, #0e0e10);
    border: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-badge svg { width: 40px; height: 40px; color: #8a8a8f; }
  .empty-text { font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: #d5d5d8; }
  .empty-sub { margin-top: 8px; font-size: 13px; color: #6f6f74; }
  .open-btn {
    margin-top: 30px; display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 26px; border-radius: 12px; border: none; cursor: pointer;
    background: #2563eb; color: #fff; font-size: 14px; font-weight: 500;
    transition: background .15s ease, transform .1s ease;
  }
  .open-btn:hover { background: #1d4ed8; }
  .open-btn:active { transform: scale(.97); }
  .open-btn svg { width: 16px; height: 16px; }

  /* 右侧播放列表 */
  .playlist {
    width: 340px; flex: 0 0 340px; background: #111113; border-left: 1px solid rgba(255,255,255,.06);
    display: flex; flex-direction: column;
  }
  .pl-head {
    display: flex; align-items: baseline; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .pl-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .pl-count { font-size: 12px; color: #6f6f74; }
  .pl-scroll { flex: 1 1 auto; overflow-y: auto; padding: 4px 0; }
  .pl-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 20px; cursor: pointer;
    color: #a6a6ab; transition: background .12s ease, color .12s ease; border-left: 2px solid transparent;
  }
  .pl-item:hover { background: rgba(255,255,255,.03); color: #d0d0d4; }
  .pl-item.active { background: rgba(37,99,235,.10); color: #fff; border-left-color: #2563eb; }
  .pl-num { font-size: 11px; font-variant-numeric: tabular-nums; color: #6f6f74; width: 16px; text-align: right; }
  .pl-name { flex: 1 1 auto; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-dur { font-size: 12px; font-variant-numeric: tabular-nums; color: #6f6f74; }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="stage-topbar">
      <span class="stage-title">ASPlayer</span>
      <div class="toolbar">
        <button class="iconbtn" title="字幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M11 10h6"/></svg></button>
        <button class="iconbtn" title="翻译"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg></button>
        <button class="iconbtn" title="下载"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg></button>
        <button class="iconbtn" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9l2.1 2.1"/></svg></button>
        <button class="iconbtn" title="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </div>
    </div>
    <div class="canvas">
      <div class="empty">
        <div class="empty-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 13a8 8 0 0 1 16 0M12 13v5"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/></svg></div>
        <p class="empty-text">还没有在播放</p>
        <p class="empty-sub">从右侧播放列表选择，或导入你的 ASMR 资源</p>
        <button class="open-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h4l2-2h4l2 2h4v11H4z"/></svg> 打开文件</button>
      </div>
    </div>
  </section>

  <!-- 右侧播放列表 -->
  <aside class="playlist">
    <div class="pl-head">
      <span class="pl-title">播放列表</span>
      <span class="pl-count">58 个视频</span>
    </div>
    <div class="pl-scroll">
      <div class="pl-item active"><span class="pl-num">1</span><span class="pl-name">ASMR·真人舔耳朵_为哥哥舔耳朵</span><span class="pl-dur">51:59</span></div>
      <div class="pl-item"><span class="pl-num">2</span><span class="pl-name">03_妹妹打气服务_掏耳朵耳日语</span><span class="pl-dur">29:58</span></div>
      <div class="pl-item"><span class="pl-num">3</span><span class="pl-name">【中文字幕】あゆるーく僕の</span><span class="pl-dur">20:36</span></div>
      <div class="pl-item"><span class="pl-num">4</span><span class="pl-name">花舞猫1MP4</span><span class="pl-dur">15:59</span></div>
      <div class="pl-item"><span class="pl-num">5</span><span class="pl-name">女仆.mp4</span><span class="pl-dur">1:44:11</span></div>
      <div class="pl-item"><span class="pl-num">6</span><span class="pl-name">北教师 (2).mp4</span><span class="pl-dur">17:28</span></div>
      <div class="pl-item"><span class="pl-num">7</span><span class="pl-name">天降女子1-9高洁无修_男</span><span class="pl-dur">46:53</span></div>
      <div class="pl-item"><span class="pl-num">8</span><span class="pl-name">娇儿别闹4月收费福利《到家演示</span><span class="pl-dur">11:11</span></div>
    </div>
  </aside>
</div>
<script>
  document.querySelectorAll('.pl-item').forEach(function (el) {
    el.addEventListener('click', function () {
      document.querySelectorAll('.pl-item').forEach(function (x) { x.classList.remove('active'); });
      el.classList.add('active');
    });
  });
</script>
</body>
</html>
